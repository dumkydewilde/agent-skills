<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amsterdam Centraal — Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe9dd;
  --ink:#2b2b2b;
  --red:#c8203f;
  --blue:#3f52a0;
  --brown:#3c2415;
  --type:"Courier Prime", "Courier New", ui-monospace, monospace;
}
*{box-sizing:border-box;}
html{background:#cfc9bd;}
body{margin:0;padding:40px 20px;font-family:var(--type);color:var(--ink);}
.sheet{
  width:min(1040px,100%);aspect-ratio:4/3;margin:auto;display:grid;
  grid-template-columns:58% 42%;overflow:hidden;position:relative;
  background-color:var(--paper);
  background-image:
    radial-gradient(70% 55% at 18% 8%,rgba(255,255,255,.55),transparent 60%),
    radial-gradient(50% 40% at 88% 92%,rgba(138,106,74,.10),transparent 65%),
    repeating-linear-gradient(0deg,rgba(120,100,75,.035) 0 1px,transparent 1px 3px),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='.35'/></svg>");
  background-blend-mode:normal,normal,normal,multiply;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px -22px rgba(60,50,35,.55);
}
.entry{padding:9% 7% 9% 10%;}
.heading{margin:0 0 1.55em;font-size:13px;letter-spacing:.16em;}
.body{margin:0;font-size:12.5px;line-height:2.05;text-wrap:pretty;}
.body p{margin:0 0 1.35em;}
.ul{--mark:var(--red);white-space:nowrap;}
.marks{position:absolute;inset:0;pointer-events:none;z-index:3;}
.mk{position:absolute;mix-blend-mode:multiply;filter:var(--f,url(#handmark1));}
.mk.m2{--f:url(#handmark2);}.mk.m3{--f:url(#handmark3);}
.mk--ul{background:var(--mark);border-radius:2px;}
.stamp-column{display:flex;flex-direction:column;justify-content:flex-end;padding:0 12% 11%;}
.stamp-wrap{height:32%;display:grid;place-items:center;margin-bottom:5%;}
.stamp{display:block;max-width:88%;max-height:100%;mix-blend-mode:multiply;}
.caption{margin:0;white-space:pre-line;font-size:12px;line-height:1.95;}
.caption .name{letter-spacing:.16em;}
.source{margin:.8em 0 0;font-size:8px;line-height:1.45;letter-spacing:.08em;text-transform:uppercase;color:#6b6257;}
.source a{color:inherit;text-decoration-color:rgba(43,43,43,.4);}
figcaption{width:min(1040px,100%);margin:10px auto 0;text-align:center;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#6b6257;}
@media (max-width:680px){
  body{padding:0;}.sheet{width:100%;aspect-ratio:auto;min-height:100svh;grid-template-columns:1fr;}
  .entry{padding:13% 11% 5%;}.stamp-column{min-height:430px;padding:4% 14% 14%;}
}
@media print{html,body{background:#fff;padding:0;}.sheet{width:100%;box-shadow:none;}figcaption{display:none;}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="handmark1" x="-12%" y="-30%" width="124%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.022 0.31" numOctaves="3" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="handmark2" x="-12%" y="-30%" width="124%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.028 0.26" numOctaves="3" seed="19" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.0" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="handmark3" x="-12%" y="-30%" width="124%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.018 0.36" numOctaves="3" seed="31" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.8" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
<figure style="margin:0">
  <article class="sheet" aria-labelledby="title">
    <section class="entry">
      <h1 id="title" class="heading">AMSTERDAM CENTRAAL · 1889</h1>
      <div class="body">
        <p><span class="ul" data-ink="c1">Amsterdam Centraal</span> opened on 15 October 1889. Its Dutch architect, <span class="ul" data-ink="c1">Pierre Cuypers</span>, also designed the Rijksmuseum. The station building combines Gothic Revival and Renaissance Revival forms, with two turrets, stone reliefs, and a royal waiting room.</p>
        <p>The station replaced Amsterdam Willemspoort, which closed in 1878, and the temporary Westerdok station. Construction began in 1882 on <span class="ul" data-ink="c1">three artificial islands</span> in the IJ, made with sand from the Velsen dunes. The ground required <span class="ul" data-ink="c1">8,687 wooden piles</span>.</p>
        <p>The main building was complete in 1884; the platform roof came later. Civil engineer L. J. Eijmer designed 50 curved trusses, manufactured in Derby, England, spanning almost <span class="ul" data-ink="c1">45 metres</span>.</p>
        <p>The station has 15 tracks beside 11 platforms. Its longest platform is 695 metres, the second longest in the Netherlands. Rail connects here with metro lines 51–54, trams, ferries, buses, and international services.</p>
        <p>The harbour-front location was contentious because it separated the city from the IJ. After opening, streets were realigned and canals were filled; tramways and cars replaced waterways as the principal movement through the city centre.</p>
        <p>Reconstruction has continued since 1997 for the North–South Line and larger passenger tunnels. In 2018, <span class="ul" data-ink="c1">192,178 passengers a day</span> used the station.</p>
      </div>
    </section>
    <aside class="stamp-column" aria-label="Station rubber stamp and source credit">
      <div class="stamp-wrap">
        <img class="stamp" src="amsterdam-centraal-rubber-stamp.png" alt="Hand-carved rubber-stamp sketch of Amsterdam Centraal station">
      </div>
      <p class="caption"><span class="name">AMSTERDAM CENTRAAL</span>
No. 01
rail / piles / IJ
1889</p>
      <p class="source">Stamp after a <a href="https://commons.wikimedia.org/wiki/File:Amsterdam_Centraal_2016-09-13.jpg">photo by Slaunger / CC BY-SA 4.0</a><br>Facts: <a href="https://en.wikipedia.org/wiki/Amsterdam_Centraal_station">English Wikipedia</a></p>
    </aside>
  </article>
  <figcaption>Field notes · Amsterdam Centraal</figcaption>
</figure>
<script>
const underlineRandom = (low, high) => low + Math.random() * (high - low);
const underlineHands = new WeakMap();
function handForUnderline(element) {
  if (!underlineHands.has(element)) {
    underlineHands.set(element, {
      filter: ["m1", "m2", "m3"][Math.floor(Math.random() * 3)],
      rotation: underlineRandom(-1.9, 0.7),
      left: underlineRandom(1, 6), right: underlineRandom(3, 9),
      grow: underlineRandom(1, 3),
    });
  }
  return underlineHands.get(element);
}
function drawMarks() {
  for (const sheet of document.querySelectorAll(".sheet")) {
    const runs = sheet.querySelectorAll(".ul");
    let layer = sheet.querySelector(":scope > .marks");
    if (!layer) { layer = document.createElement("div"); layer.className = "marks"; sheet.append(layer); }
    layer.replaceChildren();
    const sheetRect = sheet.getBoundingClientRect();
    for (const run of runs) {
      const hand = handForUnderline(run);
      const colour = getComputedStyle(run).getPropertyValue("--mark").trim();
      [...run.getClientRects()].forEach((rect, index, allRects) => {
        const left = index === 0 ? hand.left : 0;
        const right = index === allRects.length - 1 ? hand.right : 0;
        const mark = document.createElement("div");
        mark.className = `mk mk--ul ${hand.filter}`;
        mark.style.setProperty("--mark", colour);
        mark.style.left = `${rect.left - sheetRect.left - left}px`;
        mark.style.top = `${rect.bottom - sheetRect.top - 2 + hand.grow}px`;
        mark.style.width = `${rect.width + left + right}px`;
        mark.style.height = "2px";
        mark.style.transform = `rotate(${hand.rotation.toFixed(2)}deg)`;
        layer.append(mark);
      });
    }
  }
}
document.fonts.ready.then(() => { drawMarks(); addEventListener("resize", drawMarks); });
</script>
</body>
</html>
